<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tick Tock Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;background:#0b0b10;color:#fff}.card{width:min(420px,92vw);padding:32px;border:1px solid #292936;border-radius:22px;background:#15151d;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px}p{color:#a8a8b8}label{display:block;margin:18px 0 7px;color:#d8d8e2}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #383844;background:#0e0e14;color:#fff;font-size:16px}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:12px;background:#fff;color:#111;font-weight:700;font-size:16px;cursor:pointer}.error{padding:12px;border-radius:10px;background:#4b1820;color:#ffb8c0}
</style>
</head>
<body><main class="card"><h1>👑 Tick Tock Admin</h1><p>Private control panel</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input type="password" name="password" autocomplete="current-password" required><button>Sign in</button></form></main></body></html>
