<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tick Tock — Reset Password</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#24134b,#08080d 55%);color:#fff;font-family:Arial;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);padding:30px;border:1px solid #ffffff18;border-radius:26px;background:#111119e8;box-shadow:0 25px 80px #0008}h1{text-align:center}.sub{text-align:center;color:#aaa}input{width:100%;padding:15px;margin:8px 0;border-radius:14px;border:1px solid #ffffff16;background:#09090f;color:#fff}button{width:100%;padding:15px;border:0;border-radius:14px;margin-top:10px;font-weight:800;background:linear-gradient(90deg,#ff2d8d,#7957ff);color:#fff}.error{padding:12px;border-radius:12px;background:#3a1518;color:#ffbaba}.back{display:block;text-align:center;color:#aaa;margin-top:18px;text-decoration:none}</style></head><body><main class="card"><h1>🔐 Reset password</h1><p class="sub">Enter your registered Gmail. We'll send a verification code.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST"><input type="email" name="username" value="{{ entered_email|default('') }}" placeholder="Gmail address" autocomplete="username" required><button type="submit">Send Reset OTP</button></form><a class="back" href="{{ url_for('login') }}">← Back to Login</a></main></body></html>
