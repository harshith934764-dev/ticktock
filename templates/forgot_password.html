<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tick Tock - Forgot Password</title>
<style>
body{margin:0;background:#07070c;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{width:min(420px,90%);background:#151522;padding:28px;border-radius:22px}
input,button{width:100%;padding:13px;margin-top:10px;border-radius:12px;box-sizing:border-box}
input{background:#0e0e18;color:#fff;border:1px solid #34344a}
button{border:0;background:#7055ff;color:#fff;font-weight:bold}
.err{color:#ff7b9c;margin:10px 0}
a{color:#a994ff}
</style>
</head>
<body>
<div class="box">
<h2>🔑 Forgot Password</h2>
<p style="color:#aaa">Enter your registered Gmail. We will send a reset OTP.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="POST">
<input name="username" type="email" placeholder="yourname@gmail.com" required>
<button type="submit">Send Reset OTP</button>
</form>
<p><a href="/login">← Back to Login</a></p>
</div>
</body>
</html>
