<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Tick Tock</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 92%;
            max-width: 400px;
            padding: 30px;
            background: #151515;
            border-radius: 22px;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #333;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: 0;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(.98);
        }

        .rules {
            margin-top: 12px;
            padding: 12px;
            background: #202020;
            border-radius: 10px;
            font-size: 13px;
        }

        .rule {
            margin: 6px 0;
            color: #ff5555;
        }

        .valid {
            color: #4cff88;
        }

        #error {
            text-align: center;
            color: #ff5555;
            margin-top: 12px;
            min-height: 18px;
        }

        .login {
            text-align: center;
            color: #aaa;
            margin-top: 20px;
        }

        a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🎬 Tick Tock</h1>

    <div class="subtitle">
        Create your account
    </div>

    <form
        method="POST"
        action="{{ url_for('register') }}"
        onsubmit="return registerUser()"
    >

        <input
            type="email"
            id="email"
            name="username"
            placeholder="Enter Gmail"
            autocomplete="email"
            required
        >

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create password"
            autocomplete="new-password"
            required
        >

        <div class="rules">

            <div id="length" class="rule">
                ❌ At least 8 characters
            </div>

            <div id="upper" class="rule">
                ❌ One uppercase letter
            </div>

            <div id="lower" class="rule">
                ❌ One lowercase letter
            </div>

            <div id="number" class="rule">
                ❌ One number
            </div>

            <div id="special" class="rule">
                ❌ One special character
            </div>

        </div>

        <!-- ALWAYS CLICKABLE -->
        <button type="submit">
            Register 🚀
        </button>

        <div id="error"></div>

    </form>

    <div class="login">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </div>

</div>


<script>

const password =
    document.getElementById("password");

password.addEventListener("input", checkRules);


function setRule(id, valid, text) {

    const element =
        document.getElementById(id);

    if (valid) {

        element.className = "rule valid";

        element.innerHTML =
            "✅ " + text;

    } else {

        element.className = "rule";

        element.innerHTML =
            "❌ " + text;
    }
}


function checkRules() {

    const value = password.value;

    setRule(
        "length",
        value.length >= 8,
        "At least 8 characters"
    );

    setRule(
        "upper",
        /[A-Z]/.test(value),
        "One uppercase letter"
    );

    setRule(
        "lower",
        /[a-z]/.test(value),
        "One lowercase letter"
    );

    setRule(
        "number",
        /[0-9]/.test(value),
        "One number"
    );

    setRule(
        "special",
        /[^A-Za-z0-9]/.test(value),
        "One special character"
    );
}


function registerUser() {

    const email =
        document.getElementById("email").value.trim();

    const value =
        password.value;

    const error =
        document.getElementById("error");

    error.innerText = "";


    // Gmail check
    if (!email.toLowerCase().endsWith("@gmail.com")) {

        error.innerText =
            "❌ Please enter a Gmail address.";

        return false;
    }


    // Password checks
    if (value.length < 8) {

        error.innerText =
            "❌ Password needs at least 8 characters.";

        return false;
    }

    if (!/[A-Z]/.test(value)) {

        error.innerText =
            "❌ Add at least one uppercase letter.";

        return false;
    }

    if (!/[a-z]/.test(value)) {

        error.innerText =
            "❌ Add at least one lowercase letter.";

        return false;
    }

    if (!/[0-9]/.test(value)) {

        error.innerText =
            "❌ Add at least one number.";

        return false;
    }

    if (!/[^A-Za-z0-9]/.test(value)) {

        error.innerText =
            "❌ Add at least one special character.";

        return false;
    }


    // Everything is valid
    error.innerText =
        "✅ Creating your account...";

    return true;
}

</script>

</body>
</html>
