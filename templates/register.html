<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tick Tock • Create account</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#432568,#0b0b12 55%);color:#fff;font-family:Inter,system-ui}.card{width:min(440px,100%);padding:28px;border-radius:28px;background:#ffffff0b;border:1px solid #ffffff18;box-shadow:0 25px 70px #0008}h1{margin:0;font-size:32px}.sub{color:#aaa;margin:8px 0 24px}label{display:block;color:#bbb;font-size:13px;margin:14px 3px 7px}input{width:100%;padding:14px;border-radius:14px;border:1px solid #ffffff18;background:#0d0c15;color:#fff;font:inherit}button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,#9a5cff,#e052ff);color:#fff;font-weight:800;font-size:15px}.err{margin:14px 0;padding:12px;border-radius:12px;background:#ff3b3018;color:#ffb0aa}.foot{margin-top:18px;text-align:center;color:#999;font-size:14px}.foot a{color:#c6aaff}</style>
<style id="premium-register-ui">

/* TICK TOCK PREMIUM UI — V3.1 */
:root{--bg:#08090d;--panel:rgba(18,19,25,.88);--panel2:rgba(255,255,255,.055);--line:rgba(255,255,255,.11);--muted:#9b9da8;--text:#f7f7fa;--accent:#8b7cff;--accent2:#b58cff;--good:#62d6a0}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;background:var(--bg)!important;color:var(--text)!important}
button,input,textarea,select{font-family:inherit!important}
button{transition:transform .18s ease,opacity .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease}
button:active{transform:scale(.98)}

body{background:radial-gradient(700px 500px at 50% -10%,rgba(119,100,255,.18),transparent 65%),#08090d!important}
.card{width:min(470px,100%)!important;padding:36px!important;border-radius:30px!important;background:linear-gradient(180deg,rgba(22,23,30,.96),rgba(12,13,18,.96))!important;border:1px solid var(--line)!important;box-shadow:0 35px 110px rgba(0,0,0,.6)!important}
h1{font-size:32px!important;letter-spacing:-1px!important}.sub{color:#9698a4!important;line-height:1.5!important}label{color:#c7c8d0!important;font-weight:650!important}input{padding:16px!important;background:#0a0b10!important;border:1px solid rgba(255,255,255,.1)!important;border-radius:16px!important}input:focus{border-color:rgba(139,124,255,.7)!important;box-shadow:0 0 0 4px rgba(139,124,255,.1)!important}button{background:linear-gradient(135deg,#8173ff,#a989ff)!important;box-shadow:0 12px 28px rgba(112,93,255,.2)!important;border-radius:16px!important}.err{background:rgba(255,255,255,.045)!important;border:1px solid var(--line)!important;border-radius:15px!important;color:#ffb7b7!important}.foot{color:#858792!important}.foot a{color:#b6a9ff!important}
</style></head><body><form class="card" method="post"><h1>Join Tick Tock ✦</h1><div class="sub">Create your account once. Your account stays yours.</div>{% if error %}<div class="err">{{error}}</div>{% endif %}<label>Gmail</label><input name="username" type="email" placeholder="you@gmail.com" value="{{entered_email or ''}}" autocomplete="email" required><label>Password</label><input name="password" type="password" placeholder="8+ characters" autocomplete="new-password" required><button>Create account →</button><div class="foot">Already have an account? <a href="{{url_for('login')}}">Log in</a></div></form></body></html>
