<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tick Tock - Reset Password</title>
<style>
body{margin:0;background:#07070c;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{width:min(420px,90%);background:#151522;padding:28px;border-radius:22px}
input,button{width:100%;padding:13px;margin-top:10px;border-radius:12px;box-sizing:border-box}
input{background:#0e0e18;color:#fff;border:1px solid #34344a}
button{border:0;background:#7055ff;color:#fff;font-weight:bold}
.err{color:#ff7b9c;margin:10px 0}
small{color:#999}
</style>
</head>
<body>
<div class="box">
<h2>🔐 Reset Password</h2>
<small>OTP sent to {{ email }}</small>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="POST" action="/reset-password">
<input name="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP" required>
<input name="password" type="password" placeholder="New password" required>
<button type="submit">Reset Password</button>
</form>
<p style="color:#999">Password: 8+ chars, uppercase, lowercase, number and special character.</p>
</div>
</body>
</html>
