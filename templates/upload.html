<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tick Tock • Upload</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08090d;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:rgba(20,21,28,.94);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:24px;box-shadow:0 30px 100px #0008}.head{display:flex;align-items:center;justify-content:space-between}.head h1{font-size:25px;margin:0}.back{color:#bbb;text-decoration:none}.pick{margin-top:20px;border:1px dashed #ffffff2b;border-radius:20px;padding:26px;text-align:center;background:#ffffff06}.pick input{width:100%;margin-top:14px}.field{margin-top:14px}textarea,select{width:100%;padding:13px;border-radius:14px;background:#0b0c11;color:#fff;border:1px solid #ffffff15;font:inherit}textarea{min-height:100px;resize:vertical}.btn{margin-top:18px;width:100%;border:0;border-radius:15px;padding:15px;background:linear-gradient(135deg,#8173ff,#aa86ff);color:#fff;font-weight:900;font-size:15px}.progress{display:none;margin-top:18px}.track{height:12px;border-radius:99px;background:#262737;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#7d6cff,#c16cff)}.meta{display:flex;justify-content:space-between;color:#aaa;font-size:13px;margin-top:9px}.success{display:none;margin-top:15px;padding:13px;border-radius:13px;background:#49d29118;border:1px solid #49d29140;color:#8ce9bd;font-weight:800}.error{color:#ff8f9d;margin-top:12px}</style><style id="tt-v8-brand-css">:root{--tt-blue:#18a8ff;--tt-cyan:#2ee6ff;--tt-pink:#ff2d75}.tt-busy{position:fixed;inset:0;z-index:99999;display:none;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(24,168,255,.15),transparent 32%),rgba(3,5,10,.94);backdrop-filter:blur(12px)}.tt-busy.show{display:grid}.tt-busy-card{width:min(370px,88vw);padding:25px 22px;text-align:center;border-radius:28px;background:linear-gradient(145deg,rgba(20,25,42,.985),rgba(7,10,18,.995));border:1px solid rgba(46,230,255,.18);box-shadow:0 30px 100px #000b}.tt-busy-logo{width:min(145px,42vw);height:min(145px,42vw);object-fit:cover;border-radius:24px;display:block;margin:0 auto 14px;box-shadow:0 0 45px rgba(24,168,255,.16);animation:ttPulse 1.25s ease-in-out infinite}.tt-busy-name{font-size:25px;font-weight:950;background:linear-gradient(90deg,#fff,var(--tt-cyan),var(--tt-blue),var(--tt-pink));-webkit-background-clip:text;color:transparent}.tt-busy-text{margin-top:7px;color:#c7cfdd;font-size:13px;font-weight:750;min-height:19px}.tt-busy-sub{margin-top:3px;color:#707b8f;font-size:11px;letter-spacing:.2px}.tt-busy-track{height:4px;width:175px;margin:17px auto 0;border-radius:99px;background:#ffffff17;overflow:hidden}.tt-busy-track span{display:block;width:42%;height:100%;background:linear-gradient(90deg,var(--tt-blue),var(--tt-cyan),var(--tt-pink));animation:ttMove .9s linear infinite}@keyframes ttPulse{50%{transform:scale(1.025)}}@keyframes ttMove{0%{transform:translateX(-150%)}100%{transform:translateX(390%)}}.tt-brand-mark{display:inline-flex;align-items:center;gap:8px;font-weight:950}.tt-brand-mark img{width:32px;height:32px;border-radius:9px;object-fit:cover}</style></head><body><div id="ttBusy" class="tt-busy" aria-live="polite" aria-busy="false"><div class="tt-busy-card"><img class="tt-busy-logo" src="/static/ticktock-logo.png?v=8" alt="Tick Tock" width="145" height="145"><div class="tt-busy-name">Tick Tock</div><div id="ttBusyText" class="tt-busy-text">Loading…</div><div class="tt-busy-sub">WATCH • SHARE • DISCOVER</div><div class="tt-busy-track"><span></span></div></div></div></div><main class="card"><div class="head"><h1 class="tt-brand-mark"><img src="{{ url_for('static', filename='ticktock-logo.png') }}?v=8" alt=""> Tick Tock • Upload</h1><a class="back" href="/home">← Home</a></div><div class="pick">🎬 Choose a video<input id="video" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-m4v,video/*"></div><div class="field"><textarea id="caption" maxlength="500" placeholder="Write a caption…"></textarea></div><div class="field"><input id="tags" maxlength="500" placeholder="#hashtags" style="width:100%;padding:13px;border-radius:14px;background:#0b0c11;color:#fff;border:1px solid #ffffff15"></div><div class="field"><select id="privacy"><option value="public">Public — show in Home</option><option value="private">Private</option></select></div><button id="uploadBtn" class="btn">Upload Reel</button><div id="progress" class="progress"><div class="track"><div id="bar" class="bar"></div></div><div class="meta"><span id="pct">0%</span><span id="status">Uploading…</span></div></div><div id="success" class="success">✓ Successfully uploaded — your Reel has been added to Home.</div><div id="error" class="error"></div></main><script>const $=id=>document.getElementById(id);$('uploadBtn').onclick=()=>{ttLoadingStart('Uploading your Reel…');const file=$('video').files[0];if(!file){$('error').textContent='Choose a video first.';return;}$('error').textContent='';$('progress').style.display='block';$('success').style.display='none';$('uploadBtn').disabled=true;const fd=new FormData();fd.append('video',file,file.name);fd.append('caption',$('caption').value.trim());fd.append('tags',$('tags').value.trim());fd.append('privacy',$('privacy').value);const x=new XMLHttpRequest();x.open('POST','/upload');x.upload.onprogress=e=>{if(e.lengthComputable){const n=Math.round(e.loaded/e.total*100);$('bar').style.width=n+'%';$('pct').textContent=n+'%';$('status').textContent=n<100?'Uploading…':'Processing…'}};x.onload=()=>{if(x.status>=200&&x.status<400){$('bar').style.width='100%';$('pct').textContent='100%';$('status').textContent='Complete';$('success').style.display='block';ttLoadingStart('Finishing your Reel…');setTimeout(()=>location.href='/home',900)}else{ttLoadingStop();$('error').textContent='Upload failed. Please try again.';$('uploadBtn').disabled=false}};x.onerror=()=>{ttLoadingStop();$('error').textContent='Network error. Please try again.';$('uploadBtn').disabled=false};x.send(fd)};</script><script>(function(){const b=document.getElementById('ttBusy'),t=document.getElementById('ttBusyText');let timer=0;window.ttLoadingStart=function(m){if(!b)return;clearTimeout(timer);t.textContent=m||'Loading…';b.setAttribute('aria-busy','true');b.classList.add('show')};window.ttLoadingStop=function(delay){clearTimeout(timer);const hide=()=>{b.classList.remove('show');b.setAttribute('aria-busy','false')};if(delay)timer=setTimeout(hide,Math.min(220,delay));else requestAnimationFrame(hide)};window.addEventListener('pageshow',()=>ttLoadingStop());window.addEventListener('load',()=>ttLoadingStop());document.addEventListener('submit',e=>{if(e.target.matches('form'))ttLoadingStart((e.target.action||'').includes('upload')?'Uploading…':'Saving…')},true);document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||a.target||a.hasAttribute('download'))return;const h=a.getAttribute('href')||'';if(h&&h[0]!=='#'&&!h.startsWith('javascript:'))ttLoadingStart(h.includes('upload')?'Opening upload…':'Opening Tick Tock…')},true)})();</script></body></html>
