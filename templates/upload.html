<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tick Tock • Upload</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08090d;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:rgba(20,21,28,.94);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:24px;box-shadow:0 30px 100px #0008}.head{display:flex;align-items:center;justify-content:space-between}.head h1{font-size:25px;margin:0}.back{color:#bbb;text-decoration:none}.pick{margin-top:20px;border:1px dashed #ffffff2b;border-radius:20px;padding:26px;text-align:center;background:#ffffff06}.pick input{width:100%;margin-top:14px}.field{margin-top:14px}textarea,select{width:100%;padding:13px;border-radius:14px;background:#0b0c11;color:#fff;border:1px solid #ffffff15;font:inherit}textarea{min-height:100px;resize:vertical}.btn{margin-top:18px;width:100%;border:0;border-radius:15px;padding:15px;background:linear-gradient(135deg,#8173ff,#aa86ff);color:#fff;font-weight:900;font-size:15px}.progress{display:none;margin-top:18px}.track{height:12px;border-radius:99px;background:#262737;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#7d6cff,#c16cff)}.meta{display:flex;justify-content:space-between;color:#aaa;font-size:13px;margin-top:9px}.success{display:none;margin-top:15px;padding:13px;border-radius:13px;background:#49d29118;border:1px solid #49d29140;color:#8ce9bd;font-weight:800}.error{color:#ff8f9d;margin-top:12px}</style></head><body><main class="card"><div class="head"><h1>Upload a Reel</h1><a class="back" href="/home">← Home</a></div><div class="pick">🎬 Choose a video<input id="video" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-m4v,video/*"></div><div class="field"><textarea id="caption" maxlength="500" placeholder="Write a caption…"></textarea></div><div class="field"><input id="tags" maxlength="500" placeholder="#hashtags" style="width:100%;padding:13px;border-radius:14px;background:#0b0c11;color:#fff;border:1px solid #ffffff15"></div><div class="field"><select id="privacy"><option value="public">Public — show in Home</option><option value="private">Private</option></select></div><button id="uploadBtn" class="btn">Upload Reel</button><div id="progress" class="progress"><div class="track"><div id="bar" class="bar"></div></div><div class="meta"><span id="pct">0%</span><span id="status">Uploading…</span></div></div><div id="success" class="success">✓ Successfully uploaded — your Reel has been added to Home.</div><div id="error" class="error"></div></main><script>const $=id=>document.getElementById(id);$('uploadBtn').onclick=()=>{const file=$('video').files[0];if(!file){$('error').textContent='Choose a video first.';return;}$('error').textContent='';$('progress').style.display='block';$('success').style.display='none';$('uploadBtn').disabled=true;const fd=new FormData();fd.append('video',file,file.name);fd.append('caption',$('caption').value.trim());fd.append('tags',$('tags').value.trim());fd.append('privacy',$('privacy').value);const x=new XMLHttpRequest();x.open('POST','/upload');x.upload.onprogress=e=>{if(e.lengthComputable){const n=Math.round(e.loaded/e.total*100);$('bar').style.width=n+'%';$('pct').textContent=n+'%';$('status').textContent=n<100?'Uploading…':'Processing…'}};x.onload=()=>{if(x.status>=200&&x.status<400){$('bar').style.width='100%';$('pct').textContent='100%';$('status').textContent='Complete';$('success').style.display='block';setTimeout(()=>location.href='/home',900)}else{$('error').textContent='Upload failed. Please try again.';$('uploadBtn').disabled=false}};x.onerror=()=>{$('error').textContent='Network error. Please try again.';$('uploadBtn').disabled=false};x.send(fd)};</script></body></html>
