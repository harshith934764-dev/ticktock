<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tick Tock — New Password</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#24134b,#08080d 55%);color:#fff;font-family:Arial;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);padding:30px;border:1px solid #ffffff18;border-radius:26px;background:#111119e8;box-shadow:0 25px 80px #0008}h1{text-align:center}.sub{text-align:center;color:#aaa}input{width:100%;padding:15px;margin:8px 0;border-radius:14px;border:1px solid #ffffff16;background:#09090f;color:#fff}button{width:100%;padding:15px;border:0;border-radius:14px;margin-top:10px;font-weight:800;background:linear-gradient(90deg,#ff2d8d,#7957ff);color:#fff}.secondary{background:#222230}.error{padding:12px;border-radius:12px;background:#3a1518;color:#ffbaba}.ok{padding:12px;border-radius:12px;background:#153a24;color:#baffd0}</style></head><body><main class="card"><h1>🔑 New password</h1><p class="sub">Code sent to {{ email }}. It expires in 3 minutes.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}{% if message %}<div class="ok">{{ message }}</div>{% endif %}<form method="POST" action="{{ url_for('reset_password') }}"><input name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit OTP" required><input type="password" name="new_password" placeholder="New password" required><input type="password" name="confirm_password" placeholder="Confirm password" required><button type="submit">Reset Password</button></form><form method="POST" action="{{ url_for('resend_reset_otp') }}"><button class="secondary" type="submit">Resend OTP</button></form></main></body></html>
