<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tick Tock • Create account</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#432568,#0b0b12 55%);color:#fff;font-family:Inter,system-ui}.card{width:min(440px,100%);padding:28px;border-radius:28px;background:#ffffff0b;border:1px solid #ffffff18;box-shadow:0 25px 70px #0008}h1{margin:0;font-size:32px}.sub{color:#aaa;margin:8px 0 24px}label{display:block;color:#bbb;font-size:13px;margin:14px 3px 7px}input{width:100%;padding:14px;border-radius:14px;border:1px solid #ffffff18;background:#0d0c15;color:#fff;font:inherit}button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,#9a5cff,#e052ff);color:#fff;font-weight:800;font-size:15px}.err{margin:14px 0;padding:12px;border-radius:12px;background:#ff3b3018;color:#ffb0aa}.foot{margin-top:18px;text-align:center;color:#999;font-size:14px}.foot a{color:#c6aaff}</style></head><body><form class="card" method="post"><h1>Join Tick Tock ✦</h1><div class="sub">Create your account once. Your account stays yours.</div>{% if error %}<div class="err">{{error}}</div>{% endif %}<label>Gmail</label><input name="username" type="email" placeholder="you@gmail.com" value="{{entered_email or ''}}" autocomplete="email" required><label>Password</label><input name="password" type="password" placeholder="8+ characters" autocomplete="new-password" required><button>Create account →</button><div class="foot">Already have an account? <a href="{{url_for('login')}}">Log in</a></div></form></body></html>
